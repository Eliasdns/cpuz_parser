name: Run automatic Continuous Integration
on:
  pull_request:
  workflow_dispatch:
    inputs:
      lint:
        description: 'Run Linter?'
        required: false
        type: boolean
        default: true
      typecheck:
        description: 'Run Static Type Check?'
        required: false
        type: boolean
        default: true
      seccheck:
        description: 'Run Static Security Analysis?'
        required: false
        type: boolean
        default: true
      nox_tests:
        description: 'Run nox tests Session?'
        required: false
        type: boolean
        default: true

jobs:
  ci:
    name: Run Continuous Integration
    runs-on: ubuntu-latest
    env:
      HAS_PRIV_FIXTURES_SECRETS: ${{ secrets.PRIV_FIXTURES_REPO_PAT != '' && secrets.PRIV_FIXTURES_PASSWORD != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/share/mise/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH

      - name: Install Dependencies
        env:
          NOX_TESTS: ${{ github.event_name != 'pull_request' && inputs.nox_tests }}
        run: |
          set -e
          mise install
          mise run install_deps:ci

      - name: Run Linter
        if: ${{ github.event_name == 'pull_request' || inputs.lint }}
        run: |
          mise run lint

      - name: Run Static Type Check
        if: ${{ github.event_name == 'pull_request' || inputs.typecheck }}
        run: |
          mise run typecheck

      - name: Run Static Security Analysis
        if: ${{ github.event_name == 'pull_request' || inputs.seccheck }}
        run: |
          mise run seccheck

      - name: Checkout Private Fixtures
        if: ${{ env.HAS_PRIV_FIXTURES_SECRETS == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: Eliasdns/cpuz_parser-priv_fixtures
          token: ${{ secrets.PRIV_FIXTURES_REPO_PAT }}
          ref: priv_fixtures
          path: .priv_fixtures-repo
          lfs: true

      - name: Decrypt and Extract Private Fixtures
        if: ${{ env.HAS_PRIV_FIXTURES_SECRETS == 'true' }}
        env:
          PRIV_FIXTURES_PASSWORD: ${{ secrets.PRIV_FIXTURES_PASSWORD }}
        run: |
          mise run priv_fixtures:unpack
          rm -rf .priv_fixtures-repo

      - name: Run nox tests Session
        if: ${{ github.event_name != 'pull_request' && inputs.nox_tests }}
        run: |
          mise run test:nox
